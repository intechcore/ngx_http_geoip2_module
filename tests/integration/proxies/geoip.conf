# The modules behind the load balancer. The variables have no source=, so
# they use the client address: after geoip2_proxy in http, after the stream
# realip module in stream.
load_module modules/ngx_http_geoip2_module.so;
load_module modules/ngx_stream_geoip2_module.so;

worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;

    # The CDN (client) and the load balancer (front) are trusted.
    geoip2_proxy 172.30.123.10;
    geoip2_proxy 172.30.123.20;
    geoip2_proxy_recursive on;

    geoip2 /databases/GeoLite2-City-Test.mmdb {
        $geoip2_country default=- country iso_code;
        $geoip2_city default=- escape=uri city names en;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://172.30.123.40:8080;
            proxy_set_header X-Country $geoip2_country;
            proxy_set_header X-City $geoip2_city;
        }
    }
}

stream {
    geoip2 /databases/GeoLite2-City-Test.mmdb {
        $geoip2_country default=- country iso_code;
        $geoip2_city default=- city names en;
    }

    server {
        listen 9000 proxy_protocol;
        set_real_ip_from 172.30.123.20;
        return "$geoip2_country|$geoip2_city|$remote_addr\n";
    }
}
