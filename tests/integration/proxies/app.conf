# The upstream application: returns the headers geoip set, and the
# X-Forwarded-For chain it got.
worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;

    server {
        listen 8080;
        default_type text/plain;

        location / {
            return 200 "$http_x_country|$http_x_city|$http_x_forwarded_for\n";
        }
    }
}
