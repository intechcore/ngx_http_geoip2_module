# The load balancer in front of geoip. http: adds the client address to
# X-Forwarded-For. stream: takes the client address from the PROXY protocol
# header of the trusted CDN (client) and passes it on in its own header.
worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;

    server {
        listen 8080;

        location / {
            proxy_pass http://172.30.123.30:8080;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

stream {
    server {
        listen 9000 proxy_protocol;
        set_real_ip_from 172.30.123.10;
        proxy_pass 172.30.123.30:9000;
        proxy_protocol on;
    }
}
