# Load and reload: two workers, auto_reload each second. /data/current.mmdb
# starts as tests/fixtures/a.mmdb; tests/integration/run.sh swaps it with
# b.mmdb while load.sh sends requests. 203.0.113.10 is DE in a and FR in b.
load_module modules/ngx_http_geoip2_module.so;
load_module modules/ngx_stream_geoip2_module.so;

worker_processes 2;
# notice on stderr keeps the container log short under load. The info log,
# with the "Reload MMDB" lines, goes to a file.
error_log /dev/stderr notice;
error_log /tmp/info.log info;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log off;

    geoip2 /data/current.mmdb {
        auto_reload 1s;
        $geoip2_country default=ZZ source=$http_x_ip country iso_code;
    }

    server {
        listen 8080;
        default_type text/plain;

        location / {
            return 200 "$geoip2_country\n";
        }
    }
}

stream {
    geoip2 /data/current.mmdb {
        auto_reload 1s;
        $geoip2_country default=ZZ source=$proxy_protocol_addr country iso_code;
    }

    server {
        listen 9000 proxy_protocol;
        return "$geoip2_country\n";
    }
}
