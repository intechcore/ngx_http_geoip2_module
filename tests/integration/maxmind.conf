# The modules with the MaxMind test databases: the paths of the real GeoLite2
# schema. tests/integration/run.sh sends the client address in the X-IP
# header (http) or in a PROXY protocol header (stream). "-" is the default.
load_module modules/ngx_http_geoip2_module.so;
load_module modules/ngx_stream_geoip2_module.so;

worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;

    geoip2 /databases/GeoLite2-City-Test.mmdb {
        $country default=- source=$http_x_ip country iso_code;
        $subdivision default=- source=$http_x_ip subdivisions 0 iso_code;
        $city default=- source=$http_x_ip city names en;
        $city_uri default=- source=$http_x_ip escape=uri city names en;
        $city_ja default=- source=$http_x_ip escape=uri city names ja;
        $latitude default=- source=$http_x_ip location latitude;
        $longitude default=- source=$http_x_ip location longitude;
        $geoname_id default=- source=$http_x_ip city geoname_id;
        $city_build_epoch metadata build_epoch;
    }

    geoip2 /databases/GeoLite2-Country-Test.mmdb {
        $country_db default=- source=$http_x_ip country iso_code;
        $continent default=- source=$http_x_ip continent code;
    }

    geoip2 /databases/GeoLite2-ASN-Test.mmdb {
        $asn default=- source=$http_x_ip autonomous_system_number;
        $as_org default=- source=$http_x_ip escape=uri autonomous_system_organization;
    }

    server {
        listen 8080;
        default_type text/plain;

        location / {
            return 200 "$country|$subdivision|$city|$city_uri|$city_ja|$latitude|$longitude|$geoname_id|$country_db|$continent|$asn|$as_org\n";
        }

        location /metadata {
            return 200 "$city_build_epoch\n";
        }
    }
}

stream {
    geoip2 /databases/GeoLite2-City-Test.mmdb {
        $country default=- source=$proxy_protocol_addr country iso_code;
        $city default=- source=$proxy_protocol_addr city names en;
    }

    geoip2 /databases/GeoLite2-ASN-Test.mmdb {
        $asn default=- source=$proxy_protocol_addr autonomous_system_number;
    }

    server {
        listen 9000 proxy_protocol;
        return "$country|$city|$asn\n";
    }
}
