# http without geoip2_proxy: X-Forwarded-For is ignored. stream without a
# geoip2 block: its log handler has no database to check.
load_module modules/ngx_http_geoip2_module.so;
load_module modules/ngx_stream_geoip2_module.so;

worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;

    geoip2 /fixtures/a.mmdb {
        $geoip2_client default=ZZ country iso_code;
    }

    server {
        listen 8080;
        default_type text/plain;

        location / {
            return 200 "$geoip2_client\n";
        }
    }
}

stream {
    server {
        listen 9001;
        return "ok\n";
    }
}
