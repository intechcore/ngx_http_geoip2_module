# nginx configuration for tests/run.sh. One worker, so every request hits the
# same lookup cache. The client address comes from the X-IP header.
load_module modules/ngx_http_geoip2_module.so;

worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;

    geoip2 /data/current.mmdb {
        auto_reload 1s;
        $geoip2_country default=ZZ source=$http_x_ip country iso_code;
    }

    server {
        listen 8080;

        location / {
            default_type text/plain;
            return 200 "$geoip2_country\n";
        }
    }
}
