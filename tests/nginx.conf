# nginx configuration for tests/run.sh. One worker, so every request hits the
# same lookup cache. The client address comes from the X-IP header (http) or
# from the PROXY protocol header (stream). tests/run.sh sends every request
# from inside the container.
load_module modules/ngx_http_geoip2_module.so;
load_module modules/ngx_stream_geoip2_module.so;

worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;

    # Trust X-Forwarded-For from every client. 255.255.255.255 has its own
    # parser branch, and 198.51.100.1/24 logs a warning for its low bits.
    geoip2_proxy 0.0.0.0/0;
    geoip2_proxy 255.255.255.255;
    geoip2_proxy 198.51.100.1/24;
    geoip2_proxy_recursive on;

    geoip2 /data/current.mmdb {
        auto_reload 1s;
        $geoip2_country default=ZZ source=$http_x_ip country iso_code;
        $geoip2_client default=ZZ country iso_code;
        $geoip2_location location latitude;
        $geoip2_bare source=$http_x_ip country iso_code;
        $geoip2_whole;
        $geoip2_bool source=$http_x_ip types bool;
        $geoip2_bytes source=$http_x_ip types bytes;
        $geoip2_float source=$http_x_ip types float;
        $geoip2_double source=$http_x_ip types double;
        $geoip2_double_big source=$http_x_ip types double_big;
        $geoip2_uint16 source=$http_x_ip types uint16;
        $geoip2_uint32 source=$http_x_ip types uint32;
        $geoip2_int32 source=$http_x_ip types int32;
        $geoip2_uint64 source=$http_x_ip types uint64;
        $geoip2_uint128 source=$http_x_ip types uint128;
        $geoip2_string source=$http_x_ip types string;
        $geoip2_escaped escape=uri source=$http_x_ip types escape;
        $geoip2_escaped_plain source=$http_x_ip escape=uri types string;
        $geoip2_array source=$http_x_ip types array 0;
        $geoip2_map default=MAP source=$http_x_ip types map;
        $geoip2_missing default=MISSING source=$http_x_ip types missing;
        $geoip2_bad_path default=BADPATH source=$http_x_ip types string deeper;
        $geoip2_record default=RECORD source=$http_x_ip;
        $geoip2_build_epoch metadata build_epoch;
        $geoip2_last_check metadata last_check;
        $geoip2_last_change metadata last_change;
    }

    # A relative path, resolved against the prefix /etc/nginx. No auto_reload.
    geoip2 ../../fixtures/v4.mmdb {
        $geoip2_v4 default=FAIL source=$http_x_ip country iso_code;
    }

    server {
        listen 8080;
        listen unix:/tmp/http.sock;
        default_type text/plain;

        location / {
            return 200 "$geoip2_country\n";
        }

        location /client {
            return 200 "$geoip2_client\n";
        }

        location /bare {
            return 200 "[$geoip2_bare$geoip2_whole]\n";
        }

        location /v4 {
            return 200 "$geoip2_v4\n";
        }

        location /location {
            return 200 "[$geoip2_location]\n";
        }

        location /types {
            return 200 "$geoip2_bool $geoip2_bytes $geoip2_float $geoip2_double $geoip2_double_big $geoip2_uint16 $geoip2_uint32 $geoip2_int32 $geoip2_uint64 $geoip2_uint128 $geoip2_string $geoip2_array\n";
        }

        location /fallback {
            return 200 "$geoip2_map $geoip2_missing $geoip2_bad_path $geoip2_record\n";
        }

        location /escape {
            return 200 "$geoip2_escaped $geoip2_escaped_plain\n";
        }

        location /metadata {
            return 200 "$geoip2_build_epoch $geoip2_last_check $geoip2_last_change\n";
        }
    }
}

stream {
    geoip2 /data/current.mmdb {
        auto_reload 1s;
        $geoip2_country default=ZZ source=$proxy_protocol_addr country iso_code;
        $geoip2_client default=ZZ country iso_code;
        $geoip2_location location latitude;
        $geoip2_bare source=$proxy_protocol_addr country iso_code;
        $geoip2_whole;
        $geoip2_bool source=$proxy_protocol_addr types bool;
        $geoip2_bytes source=$proxy_protocol_addr types bytes;
        $geoip2_float source=$proxy_protocol_addr types float;
        $geoip2_double source=$proxy_protocol_addr types double;
        $geoip2_double_big source=$proxy_protocol_addr types double_big;
        $geoip2_uint16 source=$proxy_protocol_addr types uint16;
        $geoip2_uint32 source=$proxy_protocol_addr types uint32;
        $geoip2_int32 source=$proxy_protocol_addr types int32;
        $geoip2_uint64 source=$proxy_protocol_addr types uint64;
        $geoip2_uint128 source=$proxy_protocol_addr types uint128;
        $geoip2_string source=$proxy_protocol_addr types string;
        $geoip2_escaped escape=uri source=$proxy_protocol_addr types escape;
        $geoip2_escaped_plain source=$proxy_protocol_addr escape=uri types string;
        $geoip2_array source=$proxy_protocol_addr types array 0;
        $geoip2_map default=MAP source=$proxy_protocol_addr types map;
        $geoip2_missing default=MISSING source=$proxy_protocol_addr types missing;
        $geoip2_bad_path default=BADPATH source=$proxy_protocol_addr types string deeper;
        $geoip2_record default=RECORD source=$proxy_protocol_addr;
        $geoip2_build_epoch metadata build_epoch;
        $geoip2_last_check metadata last_check;
        $geoip2_last_change metadata last_change;
    }

    geoip2 ../../fixtures/v4.mmdb {
        $geoip2_v4 default=FAIL source=$proxy_protocol_addr country iso_code;
    }

    # One port per response, the same responses as the http locations.
    server {
        listen 9000 proxy_protocol;
        return "$geoip2_country\n";
    }

    server {
        listen 9001 proxy_protocol;
        listen unix:/tmp/stream.sock;
        return "$geoip2_client\n";
    }

    # A TCP client of this server reaches the unix socket above through nginx,
    # so that server sees a unix socket client.
    server {
        listen 9009;
        proxy_pass unix:/tmp/stream.sock;
    }

    server {
        listen 9002 proxy_protocol;
        return "[$geoip2_bare$geoip2_whole]\n";
    }

    server {
        listen 9003 proxy_protocol;
        return "$geoip2_v4\n";
    }

    server {
        listen 9004 proxy_protocol;
        return "[$geoip2_location]\n";
    }

    server {
        listen 9005 proxy_protocol;
        return "$geoip2_bool $geoip2_bytes $geoip2_float $geoip2_double $geoip2_double_big $geoip2_uint16 $geoip2_uint32 $geoip2_int32 $geoip2_uint64 $geoip2_uint128 $geoip2_string $geoip2_array\n";
    }

    server {
        listen 9006 proxy_protocol;
        return "$geoip2_map $geoip2_missing $geoip2_bad_path $geoip2_record\n";
    }

    server {
        listen 9008 proxy_protocol;
        return "$geoip2_escaped $geoip2_escaped_plain\n";
    }

    server {
        listen 9007 proxy_protocol;
        return "$geoip2_build_epoch $geoip2_last_check $geoip2_last_change\n";
    }
}
