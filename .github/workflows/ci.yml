name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: tests
          severity: style

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  # Native runners per architecture: the module is compiled and tested without
  # QEMU emulation, for the Debian and the Alpine nginx image. The Debian jobs
  # keep the names test (amd64) and test (arm64), which the branch ruleset
  # requires.
  test:
    name: test (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: amd64
            runner: ubuntu-24.04
            target: test
            scope: amd64
          - label: arm64
            runner: ubuntu-24.04-arm
            target: test
            scope: arm64
          - label: alpine amd64
            runner: ubuntu-24.04
            target: test-alpine
            scope: alpine-amd64
          - label: alpine arm64
            runner: ubuntu-24.04-arm
            target: test-alpine
            scope: alpine-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: geoip2:test
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

      - name: Run the tests
        run: tests/run.sh geoip2:test

  # SonarCloud with coverage. The module is built with gcov inside the nginx
  # image (Dockerfile stage coverage) and runs the same tests. The analyzer then
  # needs the compile commands and the nginx build tree at the paths of that
  # build, so the tree is copied to /build on the runner.
  sonar:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for the token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Pull requests from forks get no secrets. Skip the analysis there.
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No SONAR_TOKEN, SonarCloud analysis skipped"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.token.outputs.present == 'true'

      - name: Build the coverage image
        if: steps.token.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: coverage
          load: true
          tags: geoip2:coverage
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=coverage

      - name: Run the tests with coverage
        if: steps.token.outputs.present == 'true'
        run: tests/coverage.sh geoip2:coverage build

      - name: Prepare the build tree
        if: steps.token.outputs.present == 'true'
        run: |
          sudo mkdir -p /build
          sudo chown "$(id -u):$(id -g)" /build
          id=$(docker create geoip2:coverage)
          docker cp "$id:/build/." /build/
          docker rm "$id" >/dev/null
          # The analyzer reads the sources from the checkout, not from the image.
          # Both the file field and the relative path in the arguments point there.
          sed -i -e "s|/build/module/|$GITHUB_WORKSPACE/|g" \
                 -e "s|\"\\.\\./module/|\"$GITHUB_WORKSPACE/|g" build/compile_commands.json
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libmaxminddb-dev libpcre2-dev libssl-dev zlib1g-dev >/dev/null

      - name: SonarCloud scan
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
