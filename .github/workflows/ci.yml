name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          # Follow the sourced tests/lib.sh.
          SHELLCHECK_OPTS: -x
        with:
          scandir: .
          severity: style

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      # Security audit of the workflows, for example template injection or
      # credentials left in the checkout. Informational findings do not fail.
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          min-severity: low
          version: 1.30.1

      # Each base image is pinned as nginx:<version>-<system>@sha256:<digest>,
      # and the Debian and the Alpine image of a branch hold the same nginx.
      - name: Check the nginx images
        run: |
          for branch in mainline stable; do
            echo "$branch: nginx $(scripts/nginx-version.sh "$branch")"
          done

  # Native runners per architecture: the module is compiled and tested without
  # QEMU emulation, for both nginx branches and for the Debian and the Alpine
  # nginx image. The test image is the official nginx image with libmaxminddb
  # and the modules, the files a release holds: these jobs verify what the
  # branch would publish, with the unit and the integration tests. The
  # mainline Debian jobs keep the names test (amd64) and test (arm64), which
  # the branch ruleset requires.
  test:
    name: test (${{ matrix.nginx == 'stable' && 'stable ' || '' }}${{ matrix.os == 'alpine' && 'alpine ' || '' }}${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        nginx: [mainline, stable]
        os: [debian, alpine]
        arch: [amd64, arm64]
    env:
      CACHE_SCOPE: ${{ matrix.nginx == 'stable' && 'stable-' || '' }}${{ matrix.os == 'alpine' && 'alpine-' || '' }}${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the nginx images
        id: nginx
        env:
          BRANCH: ${{ matrix.nginx }}
        run: |
          {
            echo "image=$(scripts/nginx-image.sh "$BRANCH" debian)"
            echo "alpine_image=$(scripts/nginx-image.sh "$BRANCH" alpine)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.os == 'alpine' && 'test-alpine' || 'test' }}
          build-args: |
            NGINX_IMAGE=${{ steps.nginx.outputs.image }}
            NGINX_ALPINE_IMAGE=${{ steps.nginx.outputs.alpine_image }}
          load: true
          tags: geoip2:test
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

      - name: Run the tests
        run: tests/run.sh geoip2:test

      - name: Run the integration tests
        run: tests/integration/run.sh geoip2:test

  # The tests on nginx and both modules built with AddressSanitizer and
  # UndefinedBehaviorSanitizer (Dockerfile stage asan), nginx mainline.
  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the sanitizer image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: asan
          load: true
          tags: geoip2:asan
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=asan

      - name: Run the tests
        run: tests/run.sh geoip2:asan

      - name: Run the integration tests
        run: tests/integration/run.sh geoip2:asan

  # Static analysis (Dockerfile stage analyze, scripts/analyze.sh): gcc
  # -fanalyzer, clang-tidy and cppcheck. A finding fails the job.
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Run the static analyzers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: analyze
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=analyze

  # SonarCloud with coverage. The module is built with gcov inside the nginx
  # image (Dockerfile stage coverage) and runs the same tests. The analyzer then
  # needs the compile commands and the nginx build tree at the paths of that
  # build, so the tree is copied to /build on the runner.
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for the token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Pull requests from forks get no secrets. Skip the analysis there.
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No SONAR_TOKEN, SonarCloud analysis skipped"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.token.outputs.present == 'true'

      - name: Build the coverage image
        if: steps.token.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: coverage
          load: true
          tags: geoip2:coverage
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=coverage

      - name: Run the tests with coverage
        if: steps.token.outputs.present == 'true'
        run: tests/coverage.sh geoip2:coverage build

      - name: Prepare the build tree
        if: steps.token.outputs.present == 'true'
        run: |
          sudo mkdir -p /build
          sudo chown "$(id -u):$(id -g)" /build
          id=$(docker create geoip2:coverage)
          docker cp "$id:/build/." /build/
          docker rm "$id" >/dev/null
          # The analyzer reads the sources from the checkout, not from the image.
          # Both the file field and the relative path in the arguments point there.
          sed -i -e "s|/build/module/|$GITHUB_WORKSPACE/|g" \
                 -e "s|\"\\.\\./module/|\"$GITHUB_WORKSPACE/|g" build/compile_commands.json
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libmaxminddb-dev libpcre2-dev libssl-dev zlib1g-dev >/dev/null

      - name: SonarCloud scan
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
