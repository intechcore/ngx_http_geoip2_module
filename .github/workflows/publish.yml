name: Publish

# Publishes the module image ghcr.io/intechcore/ngx_http_geoip2_module:<nginx>-<n>
# and a GitHub release with the same tag, for the mainline and the stable nginx
# branch. It runs when a build input changes on master: the module sources, the
# Dockerfile (for example a Renovate bump of an nginx version) or the nginx
# signing keys. <n> counts the builds for one nginx version and starts at 1.
# The release holds the http and the stream module for amd64 and arm64, built
# for the Debian and the Alpine nginx image. The build is reproducible: if the
# modules equal the last release of that nginx version, nothing is published.

on:
  push:
    branches: [master]
    paths:
      - config
      - 'ngx_*.[ch]'
      - Dockerfile
      - 'keys/**'
  workflow_dispatch:
    inputs:
      nginx:
        description: nginx branch to publish
        type: choice
        options: [both, mainline, stable]
        default: both
      force:
        description: publish even if the modules equal the last release
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # A push that only bumps the version of one nginx branch publishes only that
  # branch. Any other change of a build input publishes both.
  branches:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      list: ${{ steps.select.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the nginx branches
        id: select
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.nginx }}
          BEFORE: ${{ github.event.before }}
        run: |
          list='["mainline","stable"]'
          if [[ $EVENT == workflow_dispatch && $INPUT != both ]]; then
            list="[\"$INPUT\"]"
          elif [[ $EVENT == push ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            inputs=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
              config 'ngx_*.[ch]' Dockerfile keys)
            changes=$(git diff -U0 "$BEFORE" "$GITHUB_SHA" -- Dockerfile |
              grep -E '^[-+]' | grep -Ev '^(\+\+\+|---) ' || true)
            if [[ $inputs == Dockerfile ]] &&
              ! grep -Evq '^[-+]ARG NGINX_(MAINLINE|STABLE)=' <<<"$changes"; then
              branches=()
              grep -q NGINX_MAINLINE <<<"$changes" && branches+=('"mainline"')
              grep -q NGINX_STABLE <<<"$changes" && branches+=('"stable"')
              list="[$(IFS=,; echo "${branches[*]}")]"
            fi
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Publishing $list"

  # Each nginx branch and architecture is built, tested and pushed by digest on
  # its own native runner. The module in the pushed image comes from the same
  # build stage the tests ran against.
  build:
    name: build (${{ matrix.nginx }} ${{ matrix.arch }})
    needs: branches
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        nginx: ${{ fromJSON(needs.branches.outputs.list) }}
        arch: [amd64, arm64]
    env:
      # The same cache scopes as the test jobs in ci.yml.
      SCOPE: ${{ matrix.nginx == 'stable' && 'stable-' || '' }}${{ matrix.arch }}
      ALPINE_SCOPE: ${{ matrix.nginx == 'stable' && 'stable-' || '' }}alpine-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the nginx version
        id: nginx
        env:
          BRANCH: ${{ matrix.nginx }}
        run: echo "version=$(scripts/nginx-version.sh "$BRANCH")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          build-args: NGINX_VERSION=${{ steps.nginx.outputs.version }}
          load: true
          tags: geoip2:test
          cache-from: type=gha,scope=${{ env.SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.SCOPE }}

      - name: Run the tests
        run: tests/run.sh geoip2:test

      - name: Build the Alpine test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test-alpine
          build-args: NGINX_VERSION=${{ steps.nginx.outputs.version }}
          load: true
          tags: geoip2:test-alpine
          cache-from: type=gha,scope=${{ env.ALPINE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.ALPINE_SCOPE }}

      - name: Run the tests on Alpine
        run: tests/run.sh geoip2:test-alpine

      - name: Push the module image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: module
          build-args: NGINX_VERSION=${{ steps.nginx.outputs.version }}
          platforms: linux/${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=${{ env.SCOPE }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Save the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.nginx }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

      - name: Extract the module binaries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: binaries
          build-args: NGINX_VERSION=${{ steps.nginx.outputs.version }}
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=${{ env.SCOPE }}
          outputs: type=local,dest=binaries

      - name: Extract the Alpine module binaries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: binaries-alpine
          build-args: NGINX_VERSION=${{ steps.nginx.outputs.version }}
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=${{ env.ALPINE_SCOPE }}
          outputs: type=local,dest=binaries-alpine

      # The publish job puts the release tag in front once it knows it.
      - name: Name the binaries by system and architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          for f in binaries/*.so; do
            mv "$f" "${f%.so}-debian-${ARCH}.so"
          done
          for f in binaries-alpine/*.so; do
            base=${f#binaries-alpine/}
            mv "$f" "binaries/${base%.so}-alpine-${ARCH}.so"
          done
          ls -l binaries

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.nginx }}-${{ matrix.arch }}
          path: binaries/*.so
          retention-days: 1

  publish:
    name: publish (${{ matrix.nginx }})
    needs: [branches, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    strategy:
      # One run at a time: both choose a free tag from the same package list.
      max-parallel: 1
      matrix:
        nginx: ${{ fromJSON(needs.branches.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-${{ matrix.nginx }}-*
          merge-multiple: true
          path: digests

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-${{ matrix.nginx }}-*
          merge-multiple: true
          path: binaries

      - name: Write the checksums
        working-directory: binaries
        run: sha256sum -- *.so > SHA256SUMS

      # The image holds the same modules as the release, so equal checksums
      # mean an equal image too. Only the checksums count, not the file names.
      # A change of the image layout alone needs workflow_dispatch with force.
      # The next tag is the last release number plus one.
      - name: Compare with the last release
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ matrix.nginx }}
          FORCE: ${{ inputs.force }}
        run: |
          nginx=$(scripts/nginx-version.sh "$BRANCH")
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName --jq '.[].tagName' | sed -n "s/^${nginx}-//p" | sort -n | tail -1)
          changed=true
          if [[ $FORCE != true && -n $last ]] &&
            gh release download "$nginx-$last" --repo "$GITHUB_REPOSITORY" \
              --pattern SHA256SUMS --output last.sums --clobber &&
            [[ $(cut -d' ' -f1 last.sums | sort) == $(cut -d' ' -f1 binaries/SHA256SUMS | sort) ]]; then
            changed=false
            echo "## ${BRANCH}: unchanged" >> "$GITHUB_STEP_SUMMARY"
            echo "The modules equal the release $nginx-$last. Nothing is published." >> "$GITHUB_STEP_SUMMARY"
          fi
          tag="$nginx-$(( ${last:-0} + 1 ))"
          {
            echo "changed=$changed"
            echo "nginx=$nginx"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Last release $nginx-${last:-none}, changed: $changed, next: $tag"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.compare.outputs.changed == 'true'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.compare.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Put the release tag in the file names
        if: steps.compare.outputs.changed == 'true'
        env:
          TAG: ${{ steps.compare.outputs.tag }}
        working-directory: binaries
        run: |
          for f in *.so; do
            mv "$f" "${f/_module-/_module-$TAG-}"
          done
          sha256sum -- *.so > SHA256SUMS
          cat SHA256SUMS

      - name: Create the multi-arch image
        id: index
        if: steps.compare.outputs.changed == 'true'
        env:
          TAG: ${{ steps.compare.outputs.tag }}
          NGINX: ${{ steps.compare.outputs.nginx }}
          BRANCH: ${{ matrix.nginx }}
        working-directory: digests
        run: |
          # shellcheck disable=SC2046 # one argument per digest file
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" -t "${IMAGE}:${NGINX}" -t "${IMAGE}:${BRANCH}" \
            $(printf "${IMAGE}@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## Published ${BRANCH}"
            echo "- \`${IMAGE}:${TAG}\`, also \`:${NGINX}\` and \`:${BRANCH}\`"
            echo "- digest \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.compare.outputs.changed == 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.compare.outputs.changed == 'true'
        with:
          subject-path: binaries/*.so

      - name: Create the release
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.compare.outputs.tag }}
          NGINX: ${{ steps.compare.outputs.nginx }}
          BRANCH: ${{ matrix.nginx }}
        run: |
          cat > notes.md <<EOF
          ngx_http_geoip2_module and ngx_stream_geoip2_module for nginx ${NGINX} (${BRANCH}), amd64 and arm64.

          All modules are built with \`--with-compat\`. A dynamic module loads only into the
          nginx version it was built for.

          | Files | Built on | Loads into | Needs |
          |---|---|---|---|
          | \`*-${TAG}-debian-<arch>.so\` | Debian trixie (glibc) | \`nginx:${NGINX}-trixie\`, nginx.org packages for trixie | \`libmaxminddb0\` |
          | \`*-${TAG}-alpine-<arch>.so\` | Alpine (musl) | \`nginx:${NGINX}-alpine\` | \`libmaxminddb-libs\` |

          The same Debian modules are in the image \`${IMAGE}:${TAG}\`.

          Verify a download:

          \`\`\`sh
          sha256sum --check --ignore-missing SHA256SUMS
          gh attestation verify ngx_http_geoip2_module-${TAG}-debian-amd64.so --owner intechcore
          \`\`\`
          EOF
          # The latest release is the mainline one. gh release download takes it
          # without a tag.
          latest=true
          if [[ $BRANCH == stable ]]; then
            latest=false
          fi
          # BSD-2-Clause: a binary distribution carries the license.
          gh release create "$TAG" binaries/*.so binaries/SHA256SUMS LICENSE \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file notes.md --latest="$latest"
          echo "- release [${TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG})" >> "$GITHUB_STEP_SUMMARY"
