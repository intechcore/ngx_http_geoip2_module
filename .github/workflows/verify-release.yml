name: Verify release

# Verifies the published artifacts the way users take them: the latest
# release and image of each nginx branch, on Debian and Alpine, amd64 and
# arm64 (tests/integration/verify-release.sh). It runs after each publish,
# once a week and by hand. A failure means users get a broken artifact. The
# test jobs of ci.yml verify what a branch would publish.

on:
  # Called by publish.yml after each publish. A reusable workflow in place of
  # workflow_run: it runs in the context of the caller, never of other code.
  workflow_call:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.nginx }} ${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        nginx: [mainline, stable]
        os: [debian, alpine]
        arch: [amd64, arm64]
    steps:
      # The tags: verify-release.sh runs the tests of the release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the published artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ matrix.nginx }}
          OS: ${{ matrix.os }}
        run: tests/integration/verify-release.sh "$(scripts/nginx-version.sh "$BRANCH")" "$OS"
