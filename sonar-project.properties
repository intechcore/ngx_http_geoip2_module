sonar.projectKey=intechcore_ngx_http_geoip2_module
sonar.organization=intechcore
sonar.projectName=ngx_http_geoip2_module

sonar.sources=.
sonar.exclusions=tests/**,keys/**
sonar.tests=tests
sonar.test.exclusions=tests/fixtures/*.mmdb

# The stream module is compiled for analysis, but it is not in the image and
# has no tests yet.
sonar.coverage.exclusions=ngx_stream_geoip2_module.c

# Written by the sonar job in .github/workflows/ci.yml.
sonar.cfamily.compile-commands=build/compile_commands.json
sonar.coverageReportPaths=build/coverage.xml
